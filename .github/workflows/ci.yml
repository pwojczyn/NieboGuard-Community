name: Community CI

on:
  push:
    branches: [main, community/bootstrap]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install optional vision dependency
        run: python -m pip install --disable-pip-version-check -r tools/vision-ai/requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript SDK tests
        run: node --test tests/sdk-js.test.mjs
      - name: NieboGuard Compute unit tests
        run: python -m unittest discover -s tools/nieboguard-compute/tests -v
      - name: NieboGuard Compute shell syntax
        run: |
          bash -n tools/nieboguard-compute/install-linux.sh
          bash -n tools/nieboguard-compute/start-linux.sh
          bash -n tools/nieboguard-compute/uninstall-linux.sh
          python -m py_compile tools/nieboguard-compute/src/nieboguard_compute/*.py tools/nieboguard-compute/academic/prepare_academic_pack.py
      - name: NieboGuard Compute PowerShell syntax
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem tools/nieboguard-compute/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $bad = 1; $errors | ForEach-Object { Write-Error $_.Message } }
          }
          exit $bad
      - name: Example syntax checks
        run: |
          node --check examples/state_watch.mjs
          node --check examples/feed_to_csv.mjs
          python -m py_compile tools/adsb/adsb_to_geojson.py tools/audio-ai/wav_audit.py tools/sensors/rssi_distance.py tools/vision-ai/image_audit.py
