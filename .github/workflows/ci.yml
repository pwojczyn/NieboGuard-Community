name: Community CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install optional vision dependency
        run: python -m pip install --disable-pip-version-check -r tools/vision-ai/requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript SDK tests
        run: node --test tests/sdk-js.test.mjs tests/federation-sdk.test.mjs tests/federation-release.test.mjs
      - name: Federation SDK release integrity
        run: node tools/federation/release_manifest.mjs --check
      - name: Example syntax checks
        run: |
          node --check examples/state_watch.mjs
          node --check examples/feed_to_csv.mjs
          python -m py_compile tools/adsb/adsb_to_geojson.py tools/audio-ai/wav_audit.py tools/sensors/rssi_distance.py tools/vision-ai/image_audit.py
