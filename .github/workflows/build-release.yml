name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run tests
        run: |
          cd node
          go test ./... -v
      - name: Build
        run: |
          cd node
          go build ./...

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build Windows AMD64
        run: |
          cd node
          go build -o ../releases/nieboguard-node-windows-amd64.exe ./cmd/nnode
        env:
          GOOS: windows
          GOARCH: amd64

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build Linux ${{ matrix.arch }}
        run: |
          cd node
          go build -o ../releases/nieboguard-node-linux-${{ matrix.arch }} ./cmd/nnode
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}

  build-container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./node
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nieboguard-node:latest
            ghcr.io/${{ github.repository_owner }}/nieboguard-node:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-container]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Generate SHA256SUMS
        run: |
          cd releases
          sha256sum nieboguard-node-* > SHA256SUMS
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            releases/nieboguard-node-windows-amd64.exe
            releases/nieboguard-node-linux-amd64
            releases/nieboguard-node-linux-arm64
            releases/SHA256SUMS
          generate_release_notes: true